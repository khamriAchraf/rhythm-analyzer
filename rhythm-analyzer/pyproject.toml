[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythm-analyzer"
version = "0.1.0"
description = "Offline Librosa onset analyzer for Unity rhythm-game levels"
requires-python = ">=3.11"
dependencies = [
  "librosa==0.11.0",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rhythm-analyzer = "rhythm_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
